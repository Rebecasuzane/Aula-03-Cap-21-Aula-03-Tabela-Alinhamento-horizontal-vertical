<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }

        td {
            border: 1px solid black;
            padding: 10px;
        }

        .linha {
            height: 30px;
        }

        .numero {
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Trabalho com alinhamento</h1>
    <table>
        <tr>
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha"></tr>
        <td>A2</td>
        <td>B2</td>
        <td class="numero">C2</td>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
    </table>
    
</body>
</html>
